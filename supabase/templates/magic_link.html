<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; color: #0f2138; margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
    .header { background-color: #0f2138; padding: 24px; text-align: center; border-bottom: 4px solid #fcbd00; }
    .header h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 0.5px; color: #ffffff; font-style: italic; }
    .header h2 span { color: #fcbd00; }
    .content { padding: 32px 24px; text-align: center; }
    .token { font-size: 32px; font-weight: 900; letter-spacing: 6px; color: #0f2138; margin: 24px 0; background: #f3f4f6; padding: 12px; border-radius: 8px; border: 1px dashed #d1d5db; display: inline-block; }
    .button-link { display: inline-block; padding: 12px 24px; background-color: #0f2138; color: #ffffff !important; text-decoration: none; font-weight: bold; border-radius: 8px; margin-top: 16px; transition: background-color 0.2s; }
    .button-link:hover { background-color: #fcbd00; color: #0f2138 !important; }
    .footer { padding: 16px; text-align: center; font-size: 11px; color: #6b7280; background-color: #f9fafb; border-top: 1px solid #f3f4f6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>VERTICAL<span>EXPRESS</span></h2>
    </div>
    <div class="content">
      <p style="margin-top:0; font-weight: 600;">Your one-time login code is:</p>
      <div class="token">{{ .Token }}</div>
      <p style="font-size: 13px; color: #4b5563;">This code expires in 1 hour.</p>
      <a href="{{ .ConfirmationURL }}" class="button-link">Log In Now</a>
    </div>
    <div class="footer">
      &copy; 2026 Vertical Express. Delivered Fast.
    </div>
  </div>
</body>
</html>
