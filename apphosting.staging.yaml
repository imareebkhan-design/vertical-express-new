# Firebase App Hosting — the STAGING / TEST backend ("ve-staging").
#
# Layered on apphosting.yaml (shared settings) because ve-staging's environment
# name is "staging". THIS IS THE TEST BACKEND: Razorpay in TEST mode with the
# explicit opt-in (ALLOW_TEST_GATEWAY in lib/services/payments.ts) and the
# staging database. Production is apphosting.production.yaml; nothing here
# reaches it.
#
# NEXT_PUBLIC_SITE_URL is the backend's own URL.

env:
  # --- this backend's own URL (known after the first rollout; browser-visible)
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://ve-staging--vertical-express.asia-southeast1.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  # --- Which deployment this is (lib/deploy-env.ts). Staging, declared explicitly:
  # an undeclared or contradictory backend applies PRODUCTION catalogue rules
  # (attested image licences only, no QA fixture). BUILD too: static pages query
  # the catalogue at build time. A production backend sets "production".
  - variable: VE_DEPLOY_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  # --- Razorpay: TEST mode only. The key id is public; the secret is a secret.
  - variable: PAYMENT_GATEWAY
    value: razorpay-test
    availability:
      - BUILD
      - RUNTIME
  - variable: ALLOW_TEST_GATEWAY
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: RAZORPAY_KEY_ID
    value: "rzp_test_Ted08j3HWqN0s4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    value: "rzp_test_Ted08j3HWqN0s4"
    availability:
      - BUILD
      - RUNTIME
  - variable: RAZORPAY_KEY_SECRET
    secret: razorpay-key-secret
  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: razorpay-webhook-secret
  - variable: DATABASE_URL
    secret: database-url
  - variable: CRON_SECRET
    secret: cron-secret
    availability:
      - RUNTIME
  # Browser Maps key for the customer live map (lib/tracking/maps-loader.ts).
  # Inlined into the browser bundle at BUILD, so it is public by design; its
  # protection is the key's own restrictions — Maps JavaScript API only, and
  # this staging host only. Kept in Secret Manager so the repo carries no key.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY
    secret: google-maps-browser-key-staging
    availability:
      - BUILD
      - RUNTIME
