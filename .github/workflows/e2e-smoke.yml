# Browser smoke: anonymous, read-only customer journeys against a deployed backend
# (playwright.config.ts, e2e/smoke.spec.ts). Phase 1 roadmap P1.6.
#
# Run it by hand after each staging rollout (Actions → e2e-smoke → Run workflow),
# choosing the backend. The nightly schedule only fires once this file is on the
# default branch (`main`); until the release branch merges, it is manual only.
# That is also true of uptime.yml.
name: e2e-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Backend to check
        required: true
        default: https://ve-staging--vertical-express.asia-southeast1.hosted.app
  schedule:
    - cron: "30 1 * * *" # 07:00 IST

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://ve-staging--vertical-express.asia-southeast1.hosted.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
