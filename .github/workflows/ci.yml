name: CI

# Quality gate for every push and pull request. Mirrors the "Before reporting done"
# checklist in CLAUDE.md: typecheck, lint, the component tests, the commerce test
# suite and a production build must all pass.
#
# The suite writes real rows, so it runs against a throwaway Postgres service
# container — never a shared database. test-support/db-guard.mjs enforces that.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The service suite alone takes ~11 minutes locally (755 tests, 26 Sep 2026);
    # 15 left no room for the component tests and the production build.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vertical_express_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      VE_TEST_DATABASE: "1"
      NODE_ENV: test
      PAYMENT_GATEWAY: dummy
      AUTH_OTP_CHANNEL: email
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The RLS lockdown migration grants to Supabase-managed roles that do not
      # exist in a vanilla Postgres. Create no-login equivalents so the same
      # migrations apply unchanged.
      - name: Create Supabase-equivalent roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vertical_express_test <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # jsdom + Testing Library (`test-support/ui-setup.ts`). No database.
      - name: Component tests
        run: npm run test:ui

      # Guards the two blind spots the token migration could not reach:
      # retired brand colours hidden inside arbitrary values, and stray hex.
      - name: Design system
        run: npm run check:ds

      # Guards the failure that let real manufacturers' product photography ship as
      # our own catalogue: a branded file used as a product image, a category
      # composite silently substituted as a fallback, or a referenced image missing.
      - name: Assets
        run: npm run check:assets

      - name: Test
        run: npm test

      # The release artefact itself. Runs last, against the seeded throwaway
      # database above (static pages query it at build time), with no .env file
      # in the checkout. The gateway stays `dummy`: the production payment guard
      # (`assertPaymentConfig`) runs at server start, not at build.
      - name: Production build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          # scripts/check-public-env.mjs refuses a build without these, because
          # such a build renders the error screen on every page. This artefact
          # is compiled and never served, so placeholders are enough — and they
          # keep the real (public) project config out of the workflow.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.invalid
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: npm run build
