name: PR 97 browser verification
on:
  push:
    branches: ["qa/pr-97-navbar-browser"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        navbar: [before, after]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vertical_express_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      VE_TEST_DATABASE: "1"
      NODE_ENV: test
      COMMERCE_MODE: catalogue
      NEXT_TELEMETRY_DISABLED: '1'
      PAYMENT_GATEWAY: dummy
      AUTH_OTP_CHANNEL: email
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the release navbar for the baseline
        if: matrix.navbar == 'before'
        run: git restore --source=5817e00e3609ff065925771bc177c7a4e972b152 -- components/sections/navbar.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The RLS lockdown migration grants to Supabase-managed roles that do not
      # exist in a vanilla Postgres. Create no-login equivalents so the same
      # migrations apply unchanged.
      - name: Create Supabase-equivalent roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vertical_express_test <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed
      # Seeded demo products are synthetic: record test-only approvals so tests that
      # read the seed see them under the explicit-approval policy (lib/catalog-policy.ts).
      - name: Approve seeded synthetic catalogue for tests
        run: NODE_PATH=./test-support/stubs node --conditions=react-server --import ./test-support/db-guard.mjs --import tsx test-support/approve-seed-catalogue.mts

      - name: Production build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          # scripts/check-public-env.mjs refuses a build without these, because
          # such a build renders the error screen on every page. This artefact
          # is compiled and never served, so placeholders are enough — and they
          # keep the real (public) project config out of the workflow.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.invalid
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the navbar checks against the local production build
        env:
          E2E_BASE_URL: http://localhost:3000
          NAV_VERSION: ${{ matrix.navbar }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: navbar-results.json
        run: |
          env -u PAYMENT_GATEWAY NODE_ENV=production npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/navbar-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 8 --retry-all-errors --retry-delay 2 http://localhost:3000/services -o /dev/null || { tail -50 "$RUNNER_TEMP/navbar-next.log"; exit 1; }
          result=0
          npx playwright test e2e/navbar-scroll.spec.ts --workers=1 --retries=0 --reporter=list,json || result=$?
          python - <<'PY'
          import base64, json, os
          report = json.load(open("navbar-results.json"))
          drifts = []
          def visit(suite):
              for spec in suite.get("specs", []):
                  for test in spec["tests"]:
                      for result in test["results"]:
                          for attachment in result.get("attachments", []):
                              if attachment["name"] != "navbar-scroll-trace":
                                  continue
                              trace = json.loads(base64.b64decode(attachment["body"]))
                              tops = [s["contentTop"] for s in trace]
                              drift = max(tops) - min(tops)
                              drifts.append(drift)
                              print(spec["title"], "document-position range:", drift, "CSS px", flush=True)
              for child in suite.get("suites", []):
                  visit(child)
          visit(report)
          assert len(drifts) == 2, drifts
          if os.environ["NAV_VERSION"] == "before":
              assert min(drifts) > 1, drifts
          PY
          if [ "$NAV_VERSION" = after ]; then exit "$result"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navbar-${{ matrix.navbar }}-browser-results
          path: navbar-results.json
          retention-days: 7
