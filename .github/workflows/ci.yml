name: CI

# Quality gate for every push and pull request. Mirrors the "Before reporting done"
# checklist in CLAUDE.md: typecheck, lint, and the commerce test suite must all pass.
#
# The suite writes real rows, so it runs against a throwaway Postgres service
# container — never a shared database. test-support/db-guard.mjs enforces that.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vertical_express_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vertical_express_test?schema=public
      VE_TEST_DATABASE: "1"
      NODE_ENV: test
      PAYMENT_GATEWAY: dummy
      AUTH_OTP_CHANNEL: email
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The RLS lockdown migration grants to Supabase-managed roles that do not
      # exist in a vanilla Postgres. Create no-login equivalents so the same
      # migrations apply unchanged.
      - name: Create Supabase-equivalent roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vertical_express_test <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
